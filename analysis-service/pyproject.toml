[project]
name = "launch-analysis-service"
version = "0.1.0"
description = "LangGraph-driven multi-specialist code analysis crew for the Sasa Launch platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "langgraph>=0.2.50",
  "langchain-anthropic>=0.3",
  "anthropic>=0.45",
  "pydantic>=2.9",
  "httpx>=0.27",
  "python-multipart>=0.0.20",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
  "respx>=0.21",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
