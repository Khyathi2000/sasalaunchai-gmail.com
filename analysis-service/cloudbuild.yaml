substitutions:
  _REGION: us-central1
  _AR_REPO: sasa-images
  _SERVICE: sasa-analysis
  _RUNTIME_SA: sasa-analysis-runtime
  _CLOUDBUILD_SA: sasa-cloudbuild
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}

# Use the dedicated build SA created by scripts/gcp-bootstrap.sh.
serviceAccount: projects/${PROJECT_ID}/serviceAccounts/${_CLOUDBUILD_SA}@${PROJECT_ID}.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamicSubstitutions: true

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_IMAGE}:${BUILD_ID}
      - --tag=${_IMAGE}:latest
      - --cache-from=${_IMAGE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_IMAGE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      # Only the web app talks to this — keep it private.
      - --no-allow-unauthenticated
      - --service-account=${_RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com
      - --min-instances=0
      - --max-instances=4
      - --cpu=2
      - --memory=2Gi
      - --timeout=900
      - --concurrency=4
      - --port=8080
      - --set-env-vars=PYTHONUNBUFFERED=1
      - --set-secrets=ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest

images:
  - ${_IMAGE}:${BUILD_ID}
  - ${_IMAGE}:latest

timeout: 1800s
