substitutions:
  _REGION: us-central1
  _AR_REPO: sasa-images
  _SERVICE: sasa-web
  _RUNTIME_SA: sasa-runtime
  _CLOUDBUILD_SA: sasa-cloudbuild
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}

# Use our dedicated build SA (set up by scripts/gcp-bootstrap.sh) instead of the
# compute default SA. Required for source upload to work and avoids granting
# broad perms to the default SA. Custom SA requires CLOUD_LOGGING_ONLY below.
serviceAccount: projects/${PROJECT_ID}/serviceAccounts/${_CLOUDBUILD_SA}@${PROJECT_ID}.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamicSubstitutions: true

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
      - NEXT_PUBLIC_CLERK_SIGN_IN_URL
      - NEXT_PUBLIC_CLERK_SIGN_UP_URL
    args:
      - -c
      - |
        docker build \
          --build-arg=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" \
          --build-arg=NEXT_PUBLIC_CLERK_SIGN_IN_URL="$$NEXT_PUBLIC_CLERK_SIGN_IN_URL" \
          --build-arg=NEXT_PUBLIC_CLERK_SIGN_UP_URL="$$NEXT_PUBLIC_CLERK_SIGN_UP_URL" \
          --tag=${_IMAGE}:${BUILD_ID} \
          --tag=${_IMAGE}:latest \
          --cache-from=${_IMAGE}:latest \
          .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_IMAGE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com
      - --min-instances=1
      - --max-instances=1
      - --cpu=1
      - --memory=2Gi
      - --timeout=1800
      - --concurrency=20
      - --port=8080
      - --set-env-vars=NODE_ENV=production,LAUNCH_WEB_WORKDIR=/tmp/launch,GOOGLE_CLOUD_PROJECT=${PROJECT_ID}
      # NEXT_PUBLIC_CLERK_* keys are baked into the image at BUILD time (see steps[0]).
      # CLERK_SECRET_KEY is a runtime-only secret.
      - --set-secrets=ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID:latest,AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY:latest,AWS_REGION=AWS_REGION:latest,CLAUDE_MODEL=CLAUDE_MODEL:latest,CLERK_SECRET_KEY=CLERK_SECRET_KEY:latest

images:
  - ${_IMAGE}:${BUILD_ID}
  - ${_IMAGE}:latest

timeout: 1800s

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY/versions/latest
      env: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    - versionName: projects/${PROJECT_ID}/secrets/NEXT_PUBLIC_CLERK_SIGN_IN_URL/versions/latest
      env: NEXT_PUBLIC_CLERK_SIGN_IN_URL
    - versionName: projects/${PROJECT_ID}/secrets/NEXT_PUBLIC_CLERK_SIGN_UP_URL/versions/latest
      env: NEXT_PUBLIC_CLERK_SIGN_UP_URL
