substitutions:
  _REGION: us-central1
  _AR_REPO: sasa-images
  _SERVICE: sasa-web
  _RUNTIME_SA: sasa-runtime
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamicSubstitutions: true

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_IMAGE}:${BUILD_ID}
      - --tag=${_IMAGE}:latest
      - --cache-from=${_IMAGE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_IMAGE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com
      - --min-instances=1
      - --max-instances=1
      - --cpu=1
      - --memory=2Gi
      - --timeout=1800
      - --concurrency=20
      - --port=8080
      - --set-env-vars=NODE_ENV=production,LAUNCH_WEB_WORKDIR=/tmp/launch,GOOGLE_CLOUD_PROJECT=${PROJECT_ID}
      - --set-secrets=ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID:latest,AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY:latest,AWS_REGION=AWS_REGION:latest,GITHUB_TOKEN=GITHUB_TOKEN:latest,CLAUDE_MODEL=CLAUDE_MODEL:latest

images:
  - ${_IMAGE}:${BUILD_ID}
  - ${_IMAGE}:latest

timeout: 1800s
